server {
    listen 80;

    # `index.php` DISEBELUMAN `index.html`, dan itu bukan soal selera.
    #
    # `/` adalah landing page Blade yang di-render `routes/web.php@landing`.
    # `index.html` adalah hasil build SPA, dan file itu juga hidup di root
    # yang sama. Urutannya menentukan siapa yang menjawab permintaan ke `/`:
    # kalau `index.html` didahulukan, landing page tidak pernah muncul dan
    # pengunjung pusat diarahkan ke SPA yang tidak tahu harus menampilkan apa.
    index index.php index.html;

    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;

    root /var/www/public;

    charset utf-8;
    client_max_body_size 32M;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/xml image/svg+xml;

    # ---------------------------------------------------------------------
    # PHP
    # ---------------------------------------------------------------------
    # Regex, bukan prefix, dan `try_files ... =404` wajib: tanpa itu
    # `GET /upload/../../app/.env` akan membuat FastCGI menjalankan berkas
    # di luar document root.
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    # ---------------------------------------------------------------------
    # API
    # ---------------------------------------------------------------------
    # `^~` menghentikan pencocokan regex, jadi blok ini menang atas blok
    # aset statis dan blok PHP di bawah.
    #
    # Tanpa `^~`, `GET /api/tagihan-saya.pdf` akan dicocokkan sebagai file
    # statis dan dijawab `404` dari `try_files`, bukan sebagai request API.
    #
    # Tanpa `try_files ... /index.php`, path yang tidak terdaftar ikut jatuh
    # ke fallback SPA di bawah dan dijawab `200` berisi HTML. axios lalu
    # melaporkan "Unexpected token <" untuk endpoint yang sebenarnya tidak ada
    # -- pesan yang tidak pernah menyebut URL-nya.
    #
    # `^~ /api` (tanpa garis miring di akhir) juga mencakup path persis
    # `/api`, yang kalau tidak akan jatuh ke fallback SPA.
    location ^~ /api {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    # ---------------------------------------------------------------------
    # Health check
    # ---------------------------------------------------------------------
    # `/up` tidak berakhiran `.php`, jadi tanpa blok ini ia jatuh ke fallback
    # SPA dan membalas `200` selama SPA-nya ada -- termasuk saat aplikasi
    # Laravel-nya justru sedang tidak bisa booting.
    location = /up {
        try_files $uri /index.php$is_args$args;
    }

    # ---------------------------------------------------------------------
    # Aset hasil build frontend
    # ---------------------------------------------------------------------
    # Nama file sudah mengandung hash konten (mis. `index-BEO5IlQt.js`), jadi
    # URL yang sama tidak pernah menunjuk isi berbeda. Aman di-cache lama
    # sekali, dan `immutable` membuat peramban tidak perlu bertanya lagi.
    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Berkas statis lain di `public/`: favicon, robots.txt, gambar branding.
    #
    # `404` -- bukan fallback SPA. Aset yang hilang memang aset yang hilang;
    # mengirim HTML untuk permintaan `.js` membuat peramban mengeluh dengan
    # pesan yang tidak berguna, bukan menampilkan halaman rusak.
    location ~* \.(?:css|js|mjs|cjs|jpg|jpeg|png|gif|svg|ico|webp|avif|woff2?|ttf|otf|eot|map)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ---------------------------------------------------------------------
    # Upload user
    # ---------------------------------------------------------------------
    # `public/storage` adalah symlink ke `storage/app/public` yang dibuat
    # `artisan storage:link` -- dipanggil oleh `docker/entrypoint.sh` setiap
    # start, jadi symlinknya selalu ada sebelum nginx melayani request.
    #
    # Kalau symlink itu somehow hilang, blok ini menjawab 404 -- bukan HTML
    # SPA di tempat logo yang seharusnya tampil.
    location ^~ /storage/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ---------------------------------------------------------------------
    # Halaman Vue Router
    # ---------------------------------------------------------------------
    # `/login`, `/central/login`, `/app/...`, `/profil`, `/usages/...`.
    # Tidak ada berkas bernama itu di server -- memang begitu cara kerja Vue
    # Router: yang menentukan halaman adalah path di address bar, lalu router
    # di sisi klien yang mencocokkannya.
    #
    # WAJIB `location /`, bukan nama seperti `location @spa` atau
    # `location _spa`. `@` memang awalan reserved untuk named location,
    # tapi tanpa `@` depan, `location _spa` dibaca nginx sebagai prefix biasa:
    # blok yang hanya cocok untuk path literal `/_spa`. Semua route lain --
    # `/login`, `/central/login`, `/app/...` -- lalu tidak cocok ke blok mana
    # pun dan dijawab 404 oleh nginx, persis gejala yang blok ini dibuat untuk
    # mencegahnya.
    location / {
        try_files $uri $uri/ /index.html;
    }
}