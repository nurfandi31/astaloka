name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build (catches case-sensitive import breakage)
        working-directory: frontend
        env:
          # Dikosongkan, sama seperti di `deploy.yml`.
          #
          # `VITE_API_BASE_URL` yang mengunci satu host backend membuat
          # seluruh request dari subdomain lokasi ikut ke host pusat, dan
          # di produksi `TenantResolver::slugAllowed()` mengembalikan false
          # -- jadi backend tidak punya cara lain mengenali tenant.
          VITE_API_BASE_URL: ''
        run: pnpm run build

      - name: Lint (oxlint + eslint)
        working-directory: frontend
        # Tanpa `--fix`: di CI, linter tidak boleh memperbaiki diam-diam.
        # Laporan saja, supaya yang pushed tetap sama dengan yang diuji.
        run: |
          pnpm exec oxlint .
          pnpm exec eslint .

      - name: Test (teks + unit)
        working-directory: frontend
        # `test:teks` menangkap berkas rusak encoding (karakter kontrol C0/C1).
        # `test:unit` menjalankan 184 test, termasuk penjaga lisensi PrimeVue.
        run: pnpm run test

  backend:
    name: Backend tests (Pest)
    # Blocking. Sebelumnya job ini `continue-on-error: true` dengan
    # alasan "6 test gagal secara pre-existing". Kebaruan itu sudah tidak
    # berlaku: 594 test lulus (2922 assertion), lokal maupun di runner,
    # dan tidak ada satu pun test yang di-skip.
    #
    # Yang tersisa dari alasan lama: `InstallationTicket` punya test
    # transisi status yang dulu gagal. Test itu sekarang lulus, jadi
    # alasan untuk tidak memblokir merge juga sudah hilang.
    continue-on-error: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: astaloka_testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, exif, pcntl, bcmath, gd, zip, redis
          coverage: none

      - name: Install backend dependencies
        working-directory: backend
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare test environment
        working-directory: backend
        run: |
          cp -n .env.example .env || true
          php artisan key:generate

      - name: Run tests
        working-directory: backend
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_DATABASE: astaloka_testing
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan test
