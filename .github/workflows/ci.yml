name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build (catches case-sensitive import breakage)
        working-directory: frontend
        env:
          VITE_API_BASE_URL: https://pamsides.siupk.com/api
        run: pnpm run build

  backend:
    name: Backend tests (Pest) — non-blocking
    # Non-blocking: 6 test gagal secara pre-existing (bug test/produk, mis.
    # transisi status InstallationTicket). Hasil tetap terlihat di Checks.
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: pamsides_testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, exif, pcntl, bcmath, gd, zip, redis
          coverage: none

      - name: Install backend dependencies
        working-directory: backend
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare test environment
        working-directory: backend
        run: |
          cp -n .env.example .env || true
          php artisan key:generate

      - name: Run tests
        working-directory: backend
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_DATABASE: pamsides_testing
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan test
